<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Testes do Tutory Sports</title>
<style>body{font:14px system-ui;background:#0b0f19;color:#dfe7ff;padding:24px}li.ok{color:#54d1a0}li.ko{color:#ff8a8a}</style>
<script type="importmap">{ "imports": { "three": "../js/vendor/three/three.module.min.js" } }</script></head>
<body><h1>Testes do Tutory Sports</h1><p>Contas, amistosos, aprovação, ranking e envio do campeonato, com banco simulado (mesmas regras de supabase/sports.sql).</p>
<h2 id="sum">rodando…</h2><ul id="out"></ul>
<script type="module">
import { store } from '../js/core/store.js';
import * as E from '../js/core/engine.js';
import { sports, championshipImport } from '../js/core/sports.js';
import { createMockSportsDb } from './sports-mock.js';

const results = { pass: 0, failed: 0, failures: [] };
const out = document.getElementById('out');
async function test(name, fn) {
  try { await fn(); results.pass++; out.insertAdjacentHTML('beforeend', `<li class="ok">✓ ${name}</li>`); }
  catch (e) { results.failed++; results.failures.push(name + ': ' + e.message); out.insertAdjacentHTML('beforeend', `<li class="ko">✗ ${name}: ${e.message}</li>`); }
}
const eq = (a, b, m = '') => { const x = JSON.stringify(a), y = JSON.stringify(b); if (x !== y) throw new Error(`${m} esperado ${y}, veio ${x}`); };
const rejects = async (p, re) => { try { await p; } catch (e) { if (re && !re.test(e.message)) throw new Error('mensagem: ' + e.message); return e; } throw new Error('deveria falhar'); };

// Campeonato em memória (não toca data/ nem o Supabase) e administrador com token fixo.
const cloud = {
  rev: 0, doc: null,
  async load() { return { rev: this.rev, doc: this.doc && structuredClone(this.doc) }; },
  async currentRev() { return this.rev; }, listen() {},
  async login(p) { if (p !== 'certa') throw new E.UserError('Senha incorreta.'); return 'tok'; },
  async session() { return true; }, async logout() {},
  async save(t, rev, doc) { this.doc = structuredClone(doc); return { httpStatus: 200, rev: ++this.rev }; },
};
sessionStorage.clear();
await store.init({ cloud, pollMs: 1e7 });
const db = createMockSportsDb();
await sports.init(db);

const ids = {};
async function account(key, name, gender) {
  await sports.signUp({ email: key + '@x.com', password: 'segredo1', name, nick: '', gender });
  ids[key] = sports.user.id;
}

await test('Cadastro cria conta aguardando aprovação', async () => {
  await account('ana', 'Ana Souza', 'f');
  eq(sports.profile.status, 'pending'); eq(sports.approved, false);
});
await test('Conta aguardando não lança amistoso', async () => {
  await rejects(sports.need().report({ modality: 'pingpong', opponent: ids.ana, won: true }), /aguarda aprovação/);
});
await test('Senha curta e e-mail repetido são recusados', async () => {
  await rejects(sports.signUp({ email: 'ana@x.com', password: 'segredo1', name: 'Ana', gender: 'f' }), /já tem conta/);
  await rejects(sports.signUp({ email: 'z@x.com', password: '123', name: 'Z', gender: 'f' }), /6 caracteres/);
});
await test('Visitante não aprova contas', async () => {
  await rejects((async () => sports.admin((d, t) => d.adminSetStatus(t, ids.ana, 'approved')))(), /administrador/);
});
await test('Administrador vê e-mail na lista e aprova', async () => {
  await account('bia', 'Bia Lima', 'f');
  await account('caio', 'Caio Reis', 'm');
  await store.login('certa');
  const p = await sports.admin((d, t) => d.adminPending(t));
  eq(p.profiles.length, 3); eq(p.profiles.some((x) => x.email === 'bia@x.com'), true);
  for (const k of ['ana', 'bia', 'caio']) await sports.admin((d, t) => d.adminSetStatus(t, ids[k], 'approved'));
  eq((await db.profiles()).length, 3);
});
await test('Amistoso fica pendente e não conta no ranking', async () => {
  await sports.signIn('ana@x.com', 'segredo1');
  eq(sports.approved, true);
  await sports.need().report({ modality: 'pingpong', opponent: ids.bia, won: true, score: '2 x 1' });
  eq(await db.ranking('pingpong', null), []);
});
await test('Não dá para jogar contra si mesmo nem contra conta não aprovada', async () => {
  await rejects(sports.need().report({ modality: 'pingpong', opponent: ids.ana, won: true }), /adversário/);
  await rejects(sports.need().report({ modality: 'pingpong', opponent: 'x', won: true }), /adversário/);
});
await test('Aprovado pelo administrador entra no ranking: vitória 3, derrota 1', async () => {
  const p = await sports.admin((d, t) => d.adminPending(t));
  eq(p.results.length, 1);
  await sports.admin((d, t) => d.adminDecide(t, p.results[0].id, true));
  const r = await db.ranking('pingpong', null);
  eq(r.map((x) => [x.name, x.points, x.wins, x.losses]), [['Ana Souza', 3, 1, 0], ['Bia Lima', 1, 0, 1]]);
});
await test('Recusado não conta; cancelar só o próprio pendente', async () => {
  await sports.need().report({ modality: 'pingpong', opponent: ids.caio, won: true });
  const [r] = (await sports.admin((d, t) => d.adminPending(t))).results;
  await sports.admin((d, t) => d.adminDecide(t, r.id, false));
  eq((await db.ranking('pingpong', null)).some((x) => x.name === 'Caio Reis'), false);
  const { id } = await sports.need().report({ modality: 'eafc', opponent: ids.caio, won: false });
  await sports.signIn('caio@x.com', 'segredo1');
  await rejects(sports.need().cancel(id), /seu/);
  await sports.signIn('ana@x.com', 'segredo1');
  await sports.need().cancel(id);
  eq((await sports.admin((d, t) => d.adminPending(t))).results.length, 0);
});
await test('Ranking separa masculino e feminino e cada modalidade', async () => {
  await sports.signIn('caio@x.com', 'segredo1');
  const { id } = await sports.need().report({ modality: 'jiujitsu', opponent: ids.ana, won: true, method: 'Finalização' });
  await sports.admin((d, t) => d.adminDecide(t, id, true));
  eq((await db.ranking('pingpong', 'm')).length, 0);
  eq((await db.ranking('pingpong', 'f')).length, 2);
  eq((await db.ranking('jiujitsu', 'm')).map((x) => x.name), ['Caio Reis']);
  eq((await db.ranking('jiujitsu', null)).length, 2);
});
await test('Visitante só vê resultados aprovados', async () => {
  await sports.need().report({ modality: 'mk', opponent: ids.bia, won: true });
  await sports.signOut();
  eq((await db.results(null, 50)).every((r) => r.status === 'approved'), true);
});
await test('Avatar da conta aparece no ranking', async () => {
  await sports.signIn('bia@x.com', 'segredo1');
  await sports.saveAvatar({ v: 2, gender: 'female', thumb: 'data:image/webp;base64,AAA' });
  eq((await db.ranking('pingpong', null)).find((x) => x.name === 'Bia Lima').thumb, 'data:image/webp;base64,AAA');
});
await test('Campeonato encerrado vai ao ranking com título, sem duplicar', async () => {
  store.update((t) => {
    for (const n of ['Ana Souza', 'Bia Lima', 'Caio Reis', 'Davi']) E.addPlayer(t, { name: n });
    E.startDraw(t); while (t.draw.status === 'live') E.drawNext(t);
    let m; while ((m = E.nextMatch(t))) E.saveGames(t, m.id, [[11, 5], [11, 7]]);
  });
  const t = store.doc;
  store.update((d) => { for (const p of d.players) { const k = { 'Ana Souza': 'ana', 'Bia Lima': 'bia', 'Caio Reis': 'caio' }[p.name]; if (k) p.userId = ids[k]; } });
  const plan = championshipImport(store.doc, { key: 'pp-1', gameWins: E.gameWins, champion: E.champion(store.doc), vice: E.viceChampion(store.doc) });
  const finished = Object.values(store.doc.matches).filter((m) => !m.bye && m.winner && m.p[0] && m.p[1]).length;
  eq(plan.items.length + plan.skipped, finished, 'jogos');
  eq(plan.items.every((i) => /^\d+ x \d+$/.test(i.score)), true, 'placar');
  const before = (await db.ranking('pingpong', null)).reduce((s, x) => s + x.points, 0);
  await sports.admin((d, tk) => d.adminImport(tk, plan.items, plan.awards));
  const after1 = await db.ranking('pingpong', null);
  await sports.admin((d, tk) => d.adminImport(tk, plan.items, plan.awards));
  const after2 = await db.ranking('pingpong', null);
  eq(after1, after2, 'reenvio');
  const champ = E.champion(store.doc);
  const gained = after1.reduce((s, x) => s + x.points, 0) - before;
  eq(gained, plan.items.length * 4 + plan.awards.reduce((s, a) => s + ({ campeao: 10, vice: 5, terceiro: 3, participacao: 1 })[a.place], 0), 'pontos');
  eq(plan.awards.filter((a) => a.place === 'participacao').length, 3, 'participação de quem jogou e tem conta');
  if (champ.userId) eq(after1.find((x) => x.id === champ.userId).titles, 1, 'título');
});
await test('Avatar salvo na conta volta igual depois de sair e entrar', async () => {
  await sports.signIn('caio@x.com', 'segredo1');
  const av = { v: 2, gender: 'male', skin: 'negra', morph: { 'head-oval': 0.4 }, parts: { hair: 'afro01', beard: 'grinsegold_full_beard' }, colors: { hair: '#141010' }, height: 1.04, thumb: 'data:image/jpeg;base64,BBB' };
  await sports.saveAvatar(av);
  await sports.signOut();
  eq(sports.profile, null);
  await sports.signIn('caio@x.com', 'segredo1');
  eq(sports.profile.avatar, { ...av, belt: 'Branca' }, 'faixa sem validação é branca');
  eq(sports.people.get(ids.caio).avatar.parts.hair, 'afro01', 'cache das contas');
});
await test('Jogador do campeonato ligado à conta mostra o avatar da conta', async () => {
  const { avatarOf } = await import('../js/ui/lib.js');
  eq(avatarOf({ name: 'Caio Reis', userId: ids.caio }).parts.hair, 'afro01');
  eq(avatarOf({ name: 'Sem conta' }).provisional, true);
});
await test('Esqueci a senha: pedido não revela se a conta existe; admin gera provisória', async () => {
  await sports.signOut();
  eq(await sports.need().requestReset('ninguem@x.com'), { ok: true });
  eq(await sports.need().requestReset('bia@x.com'), { ok: true });
  await store.login('certa');
  const bia = (await sports.admin((d, t) => d.adminPending(t))).profiles.find((p) => p.email === 'bia@x.com');
  eq(bia.reset, true);
  const r = await sports.admin((d, t) => d.adminResetPassword(t, bia.id));
  await rejects(sports.signIn('bia@x.com', 'segredo1'), /incorretos/);
  await sports.signIn('bia@x.com', r.password);
  eq(sports.user.id, ids.bia);
  await sports.need().changePassword('segredo1');
  await store.logout();
});
await test('Foto do avatar cabe no banco mesmo sem WEBP (iPhone antigo)', async () => {
  const { encodePortrait } = await import('../js/three/avatars.js');
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  for (let i = 0; i < 4000; i++) { g.fillStyle = `hsl(${i % 360},70%,${30 + (i % 40)}%)`; g.fillRect((i * 37) % 256, (i * 91) % 256, 6, 6); }
  const orig = c.toDataURL.bind(c);
  c.toDataURL = (type, q) => (type === 'image/webp' ? orig('image/png') : orig(type, q)); // Safari sem WEBP devolve PNG
  const url = encodePortrait(c, true);
  eq(url.startsWith('data:image/jpeg'), true, 'formato');
  eq(url.length <= 12000, true, 'tamanho ' + url.length);
});
// ---------------------------------------------------------------- fase 3: rankings
await test('Pontuação por modalidade: só a modalidade alterada muda; valores inválidos recusados', async () => {
  await store.login('certa');
  const pp = await db.ranking('pingpong', null), jj0 = await db.ranking('jiujitsu', null);
  const caio0 = jj0.find((x) => x.id === ids.caio).points;
  await sports.admin((d, t) => d.adminSetPoints(t, 'jiujitsu', { win: 10, loss: 0, friendly_win: 8, friendly_loss: 0, participation: 0, champion: 20, vice: 10, third: 5, achievement: 2, weight: 1 }));
  eq((await db.ranking('jiujitsu', null)).find((x) => x.id === ids.caio).points, 8, 'vitória em amistoso vale 8 no jiu-jitsu');
  eq(caio0, 3);
  eq(await db.ranking('pingpong', null), pp, 'ping pong não mudou');
  await rejects(sports.admin((d, t) => d.adminSetPoints(t, 'jiujitsu', { win: -1, loss: 0, friendly_win: 0, friendly_loss: 0, participation: 0, champion: 0, vice: 0, third: 0, achievement: 0, weight: 1 })), /inválida/);
  await rejects(sports.admin((d, t) => d.adminSetPoints(t, '*', null)), /padrão/);
  await sports.admin((d, t) => d.adminSetPoints(t, 'jiujitsu', null));
  eq((await db.ranking('jiujitsu', null)).find((x) => x.id === ids.caio).points, 3, 'volta à pontuação padrão');
  await rejects(db.adminSetPoints('outro', '*', {}), /expirada/);
});
await test('Faixa: só entra no ranking por faixa depois de validada; trocar a faixa tira a validação', async () => {
  await sports.signIn('caio@x.com', 'segredo1');
  await sports.saveProfile({ name: 'Caio Reis', gender: 'm', belt: 'Azul' });
  eq((await db.ranking('jiujitsu', null, 'Azul')).length, 0, 'sem validação');
  await rejects(sports.saveProfile({ name: 'Caio Reis', gender: 'm', belt: 'Dourada' }), /Faixa/);
  await sports.admin((d, t) => d.adminSetBelt(t, ids.caio, 'Azul', true));
  eq((await db.ranking('jiujitsu', null, 'Azul')).map((x) => x.name), ['Caio Reis']);
  eq((await db.ranking('jiujitsu', null, 'Roxa')).length, 0);
  await sports.saveProfile({ name: 'Caio Reis', gender: 'm', belt: 'Roxa' });
  eq((await db.ranking('jiujitsu', null, 'Roxa')).length, 0, 'nova faixa espera validação');
  await sports.admin((d, t) => d.adminSetBelt(t, ids.caio, 'Roxa', true));
  eq(db._p.get(ids.caio).avatar.belt, 'Roxa', 'kimono do avatar segue a faixa validada');
  await sports.signIn('caio@x.com', 'segredo1');
  await sports.saveAvatar({ ...db._p.get(ids.caio).avatar, belt: 'Preta' });
  eq(db._p.get(ids.caio).avatar.belt, 'Roxa', 'o editor não escolhe a faixa');
});
await test('Counter-Strike por equipe: cada integrante pontua; mesma pessoa nas duas equipes recusada', async () => {
  for (const [k, n] of [['dani', 'Dani Alves'], ['edu', 'Edu Melo']]) await account(k, n, 'm');
  for (const k of ['dani', 'edu']) await sports.admin((d, t) => d.adminSetStatus(t, ids[k], 'approved'));
  await sports.signIn('caio@x.com', 'segredo1');
  await rejects(sports.need().report({ modality: 'cs', opponent: ids.dani, won: true, team: [ids.edu], opponents: [ids.edu] }), /duas equipes/);
  const { id } = await sports.need().report({ modality: 'cs', opponent: ids.dani, won: true, score: '13 x 9', team: [ids.edu, ids.ana], opponents: [ids.bia] });
  await sports.admin((d, t) => d.adminDecide(t, id, true));
  const r = await db.ranking('cs', null);
  eq(r.filter((x) => x.fwins === 1).map((x) => x.name).sort(), ['Ana Souza', 'Caio Reis', 'Edu Melo']);
  eq(r.filter((x) => x.flosses === 1).map((x) => x.name).sort(), ['Bia Lima', 'Dani Alves']);
});
await test('Amistoso repetido (mesmo dia, dupla, placar e vencedor) é recusado', async () => {
  await sports.need().report({ modality: 'eafc', opponent: ids.dani, won: true, score: '3 x 1' });
  await rejects(sports.need().report({ modality: 'eafc', opponent: ids.dani, won: true, score: '3 x 1' }), /já foi lançado/);
  await sports.signIn('dani@x.com', 'segredo1');
  await rejects(sports.need().report({ modality: 'eafc', opponent: ids.caio, won: false, score: '3 x 1' }), /já foi lançado/, 'lançado pelo outro lado');
  await sports.need().report({ modality: 'eafc', opponent: ids.caio, won: false, score: '2 x 0' });
});
await test('Ranking geral normaliza cada modalidade (líder = 100) e respeita o peso', async () => {
  const g = await db.rankingGeneral(null, null);
  for (const m of ['pingpong', 'jiujitsu', 'cs']) {
    const leader = Math.max(...g.flatMap((x) => x.parts.filter((p) => p.modality === m).map((p) => p.norm)));
    eq(leader, 100, 'líder de ' + m);
  }
  const caio = g.find((x) => x.id === ids.caio);
  eq(caio.score, Math.round(caio.parts.reduce((s, p) => s + p.score, 0) * 10) / 10);
  const base = (await db.points()).find((r) => r.modality === '*');
  await sports.admin((d, t) => d.adminSetPoints(t, 'cs', { ...base, weight: 0 }));
  eq((await db.rankingGeneral(null, null)).flatMap((x) => x.parts).filter((p) => p.modality === 'cs').every((p) => p.score === 0), true, 'peso 0 zera a modalidade');
  await sports.admin((d, t) => d.adminSetPoints(t, 'cs', null));
  const gaming = await db.rankingGeneral('gaming', null);
  eq(gaming.every((x) => x.parts.every((p) => ['eafc', 'cod', 'mk'].includes(p.modality))), true, 'TUTORY Gaming só com jogos');
  eq((await db.rankingGeneral(null, 'f')).every((x) => x.gender === 'f'), true, 'categoria');
});
await test('Conquista manual soma pontos, não duplica e pode ser removida', async () => {
  const before = (await db.ranking('pingpong', null)).find((x) => x.id === ids.bia).points;
  const { id } = await sports.admin((d, t) => d.adminAward(t, ids.bia, 'pingpong', 'Virada histórica'));
  eq((await db.ranking('pingpong', null)).find((x) => x.id === ids.bia).points, before + 2);
  await rejects(sports.admin((d, t) => d.adminAward(t, ids.bia, 'pingpong', 'virada histórica')), /já tem/);
  await sports.admin((d, t) => d.adminDeleteAward(t, id));
  eq((await db.ranking('pingpong', null)).find((x) => x.id === ids.bia).points, before);
});
await test('Campeonato: terceiro lugar, participação e categoria vão ao ranking', async () => {
  const t = { players: [{ id: 'a', name: 'A', userId: ids.ana }, { id: 'b', name: 'B', userId: ids.bia }, { id: 'c', name: 'C', userId: null }], matches: { m1: { id: 'm1', p: ['a', 'b'], winner: 'a', endedAt: Date.parse('2026-10-01T15:00:00') } }, scoring: {}, meta: { name: 'Feminino', edition: '1ª' } };
  const plan = championshipImport(t, { modality: 'pingpong', key: 'fem-1', gameWins: () => [2, 0], champion: { id: 'a' }, vice: { id: 'b' }, third: { id: 'c' }, category: 'f' });
  eq(plan.items[0].played_on, '2026-10-01'); eq(plan.items[0].category, 'f');
  eq(plan.awards.map((a) => a.place).sort(), ['campeao', 'participacao', 'participacao', 'vice'], 'sem conta não recebe terceiro');
  const r1 = await sports.admin((d, tk) => d.adminImport(tk, plan.items, plan.awards));
  eq(r1, { results: 1, awards: 4 });
  eq(await sports.admin((d, tk) => d.adminImport(tk, plan.items, plan.awards)), { results: 0, awards: 0 }, 'reenvio não duplica nem altera');
  eq(db._r.find((r) => r.source === 'fem-1:m1').category, 'f');
});
await test('Auditoria registra decisões e mudanças de pontuação; só o administrador lê', async () => {
  const log = await sports.admin((d, t) => d.adminAudit(t, 200));
  eq(log.some((a) => a.tbl === 'ranking_points' && a.op === 'insert'), true, 'pontuação');
  eq(log.some((a) => a.tbl === 'results' && a.after?.status === 'approved'), true, 'aprovação');
  eq(log.find((a) => a.tbl === 'results' && a.after?.status === 'approved').actor, 'administrador', 'quem aprovou');
  eq(log.find((a) => a.tbl === 'results' && a.op === 'insert').actor, ids.dani, 'quem lançou');
  eq(log.some((a) => a.tbl === 'profiles' && a.after?.belt_verified === true), true, 'faixa');
  await rejects(db.adminAudit('outro'), /expirada/);
});
await test('Modalidade nova aparece; desativada some das telas sem apagar resultados', async () => {
  await sports.admin((d, t) => d.adminSaveModality(t, { id: 'tenis', name: 'Tênis', family: 'esporte', kind: 'individual', sort: 7 }));
  eq((await db.modalities()).some((m) => m.id === 'tenis'), true);
  await rejects(sports.admin((d, t) => d.adminSaveModality(t, { id: 'Tênis!', name: 'x' })), /Código/);
  await sports.admin((d, t) => d.adminSaveModality(t, { id: 'eafc', name: 'EA FC', family: 'gaming', kind: 'individual', active: false, sort: 3 }));
  eq((await db.modalities()).some((m) => m.id === 'eafc'), false);
  eq(db._r.some((r) => r.modality === 'eafc'), true, 'resultados preservados');
  await sports.admin((d, t) => d.adminSaveModality(t, { id: 'eafc', name: 'EA FC', family: 'gaming', kind: 'individual', active: true, sort: 3 }));
});
await test('Sessão de administrador expirada é recusada', async () => {
  await store.logout();
  await rejects((async () => sports.admin((d, t) => d.adminPending(t)))(), /administrador/);
  await rejects(db.adminPending('outro'), /expirada/);
});

document.getElementById('sum').textContent = `${results.pass} passaram · ${results.failed} falharam`;
document.title = `${results.pass} ok / ${results.failed} falhas`;
window.__results = results;
</script></body></html>
