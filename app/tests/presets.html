<!doctype html><meta charset="utf-8"><title>Personagens</title>
<script type="importmap">{"imports":{"three":"../js/vendor/three/three.module.min.js"}}</script>
<style>body{margin:0;background:#26334a;color:#fff;font:12px sans-serif}#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--c,180px),1fr));gap:4px;padding:4px}figure{margin:0;text-align:center}img{width:100%;display:block}</style>
<div id="g"></div>
<script type="module">
import * as A from '../js/three/avatars.js';
const q = new URLSearchParams(location.search);
const kind = q.get('kind') || 'full';
const base = { outfit: 'casual', hair: 'short', skin: '#d9a07a', hairColor: '#3b2518' };
const variants = q.get('acc') ? [
  ['Óculos redondos', { glasses: 'round' }], ['Óculos quadrados', { glasses: 'square' }], ['Óculos esportivos', { glasses: 'sport' }],
  ['Munhequeiras', { wrist: 'both', colors: { wrist: '#0040c8' } }], ['Medalha', { medal: 'gold' }], ['Logo no peito', { badge: 'tutory', colors: { 'casual:Camiseta': '#0040c8' } }], ['Bola no peito', { badge: 'ball' }],
  ['Cabeção', { headShape: 'big' }], ['Alongado', { headShape: 'long' }], ['Redondo', { headShape: 'round' }],
  ['Concentrado', { expression: 'focused' }], ['Animado', { expression: 'happy' }], ['Surpreso', { expression: 'surprised' }], ['Sonolento', { expression: 'sleepy' }],
  ['Raquete pro', { racket: { style: 'pro', color: '#0040c8' } }], ['Sem raquete', { racket: { style: 'none' } }], ['Calçado branco', { shoes: '#ffffff' }], ['Cabeça de goblin', { head: 'goblin', skin: '#7f9a3f' }],
  ['Vaca no terno', { outfit: 'suit', head: 'cow' }], ['Elmo + casual', { head: 'knight' }], ['Bigode', { facial: 'cowboy' }], ['Chapéu + cabelo', { hat: 'cowboy', hair: 'long' }],
].map(([label, v]) => ({ label, cfg: A.normalizeAvatar({ ...base, ...v }) })) : q.get('hair') ? (await A.loadLibrary()).catalog.hairs.map((h) => ({ label: h.label, cfg: A.normalizeAvatar({ ...base, hairColor: '#a56b35', hair: h.id, racket: { style: 'none' } }) })) : A.PRESETS.map((p) => ({ label: p.label, cfg: A.presetToAvatar(p) }));
for (const { label, cfg } of variants) {
  if (q.get('only') && !label.includes(q.get('only'))) continue;
  const u = await A.portrait(cfg, { kind, size: 512 });
  g.insertAdjacentHTML('beforeend', `<figure><img src="${u}">${label}</figure>`);
}
document.title = 'ok';
</script>
