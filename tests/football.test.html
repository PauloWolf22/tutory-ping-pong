<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Testes do futebol</title>
<style>body{font:14px/1.5 system-ui;background:#0a0d14;color:#d0ddef;padding:24px;max-width:960px;margin:auto}.ok{color:#5fd38d}.ko{color:#ff7b7b;font-weight:700}li{list-style:none}#sum{font-size:18px;font-weight:700}</style></head>
<body><h1>Testes do Football Team Draw</h1><div id="sum"></div><ul id="out"></ul>
<script type="module">
import * as F from '../js/core/football.js';
import { UserError } from '../js/core/engine.js';
const out = document.getElementById('out');
let pass = 0, failed = 0; const failures = [];
function test(name, fn) {
  try { fn(); pass++; out.insertAdjacentHTML('beforeend', `<li class="ok">✓ ${name}</li>`); }
  catch (e) { failed++; failures.push(name + ': ' + e.message); out.insertAdjacentHTML('beforeend', `<li class="ko">✗ ${name}: ${e.message}</li>`); }
}
const eq = (a, b, m = '') => { const x = JSON.stringify(a), y = JSON.stringify(b); if (x !== y) throw new Error(`${m} esperado ${y}, veio ${x}`); };
const ok = (v, m = 'falso') => { if (!v) throw new Error(m); };
const throws = (fn, re) => { try { fn(); } catch (e) { if (!(e instanceof UserError)) throw e; if (re && !re.test(e.message)) throw new Error('mensagem: ' + e.message); return; } throw new Error('deveria falhar'); };
const seeded = (seed) => { let s = seed; return (n) => { s = (s * 1664525 + 1013904223) >>> 0; return s % n; }; };
const make = (n) => { const f = F.newFootball(); for (let i = 1; i <= n; i++) F.addPlayer(f, `J${String(i).padStart(2, '0')}`); return f; };
const healthy = (f, m = '') => { const c = F.integrity(f); ok(c.ok, `${m} integridade: ${JSON.stringify(c)}`); };
const names = (f, ids) => ids.map((id) => F.nameOf(f, id));

for (const n of [10, 11, 12, 15, 18, 20, 23, 25, 28, 30]) {
  test(`${n} jogadores: 300 jogos sem sumir nem duplicar ninguém`, () => {
    const f = make(n);
    const r = seeded(n * 7 + 1);
    F.startSession(f, r);
    eq(f.session.teams.A.length, 5); eq(f.session.teams.B.length, 5); eq(f.session.queue.length, n - 10);
    healthy(f);
    for (let g = 0; g < 300; g++) {
      const before = F.queueGroups(f);
      const w = r(2) ? 'A' : 'B', l = w === 'A' ? 'B' : 'A';
      const stay = [...f.session.teams[w]], next = [...f.session.queue, ...f.session.teams[l]].slice(0, 5);
      F.registerWinner(f, w);
      eq(f.session.teams[w], stay, 'vencedor permanece');
      eq(f.session.teams[l], next, 'próximo grupo entra');
      eq(f.session.teams[l].length, 5);
      healthy(f, `jogo ${g}`);
      ok(F.queueGroups(f).slice(0, -1).every((x) => x.length === 5), 'só o último grupo pode ser incompleto');
    }
  });
}

test('Exemplo do briefing com 18: fila de 3 recebe os 2 primeiros do time perdedor', () => {
  const f = make(18);
  F.startSession(f, seeded(3));
  const s = f.session;
  eq(F.queueGroups(f).map((g) => g.length), [5, 3]);
  const [g1, g2] = F.queueGroups(f).map((g) => [...g]);
  const a = [...s.teams.A], b = [...s.teams.B];
  F.registerWinner(f, 'A');
  eq(s.teams.A, a, 'Time A permanece');
  eq(s.teams.B, g1, 'Fila 1 entra');
  eq(F.queueGroups(f), [[...g2, b[0], b[1]], [b[2], b[3], b[4]]], '3 da fila + 2 primeiros perdedores; 3 restantes depois');
  const b2 = [...s.teams.B];
  F.registerWinner(f, 'B');
  eq(s.teams.B, b2, 'novo Time B permanece');
  eq(s.teams.A, [...g2, b[0], b[1]], 'grupo completado entra');
  eq(F.queueGroups(f), [[b[2], b[3], b[4], a[0], a[1]], [a[2], a[3], a[4]]]);
  healthy(f);
});

test('Ninguém é ultrapassado: cada jogador espera exatamente quem está à frente', () => {
  const f = make(23);
  F.startSession(f, seeded(9));
  const target = f.session.queue[12];
  let games = 0;
  while (!(f.session.teams.A.includes(target) || f.session.teams.B.includes(target))) {
    F.registerWinner(f, 'A');
    games++;
    ok(games < 50);
  }
  eq(games, 3, 'posição 13 da fila entra no 3º jogo');
});

test('Sorteio usa os 10 primeiros a chegar e embaralha sem duplicar', () => {
  const seen = new Set();
  for (let i = 1; i <= 200; i++) {
    const f = make(14);
    F.startSession(f, seeded(i));
    const first = [...f.session.teams.A, ...f.session.teams.B];
    eq(new Set(first).size, 10);
    eq(names(f, first).sort(), Array.from({ length: 10 }, (_, k) => `J${String(k + 1).padStart(2, '0')}`));
    seen.add(names(f, f.session.teams.A).join());
  }
  ok(seen.size > 150, 'times variados: ' + seen.size);
});

test('Sorteio real (crypto) funciona', () => { const f = make(18); F.startSession(f); healthy(f); });

test('Menos de 10 presentes não sorteia', () => {
  const f = make(9);
  throws(() => F.startSession(f), /pelo menos 10/);
  F.addPlayer(f, 'J10');
  F.setPresent(f, f.players[0].id, false);
  throws(() => F.startSession(f), /Agora são 9/);
  eq(f.session, null);
});

test('Ausente fica fora: os 10 primeiros são os presentes', () => {
  const f = make(11);
  F.setPresent(f, f.players[0].id, false);
  F.startSession(f, seeded(1));
  ok(![...f.session.teams.A, ...f.session.teams.B, ...f.session.queue].includes(f.players[0].id));
  healthy(f);
});

test('Lista: limite de 30, sem nome repetido, nome vazio bloqueado', () => {
  const f = make(30);
  throws(() => F.addPlayer(f, 'Extra'), /até 30/);
  const g = make(2);
  throws(() => F.addPlayer(g, ' j01 '), /já está/);
  throws(() => F.addPlayer(g, '   '), /nome/);
  throws(() => F.renamePlayer(g, g.players[0].id, 'J02'), /já está/);
  F.renamePlayer(g, g.players[0].id, 'André');
  throws(() => F.addPlayer(g, 'ANDRE'), /já está/);
});

test('Quem chega no meio do jogo entra no fim da fila', () => {
  const f = make(12);
  F.startSession(f, seeded(2));
  const p = F.addPlayer(f, 'Atrasado');
  eq(f.session.queue.at(-1), p.id);
  healthy(f);
});

test('Saiu do campo: primeiro da fila ocupa a vaga, sem furar a ordem', () => {
  const f = make(12);
  F.startSession(f, seeded(2));
  const out = f.session.teams.A[2], first = f.session.queue[0], second = f.session.queue[1];
  F.removePlayer(f, out);
  eq(f.session.teams.A[2], first); eq(f.session.queue, [second]);
  healthy(f);
});

test('Sem fila, time fica incompleto com a contagem real, sem nome inventado', () => {
  const f = make(10);
  F.startSession(f, seeded(4));
  F.removePlayer(f, f.session.teams.A[0]);
  eq(f.session.teams.A.length, 4); eq(f.session.queue, []);
  F.registerWinner(f, 'B');
  eq(f.session.teams.A.length, 4);
  healthy(f);
});

test('Com 10 jogadores os mesmos times se repetem e o histórico avisa', () => {
  const f = make(10);
  F.startSession(f, seeded(5));
  const b = [...f.session.teams.B];
  const h = F.registerWinner(f, 'A');
  eq(f.session.teams.B, b); eq(h.sameTeam, true);
});

test('Presença volta para o fim da fila', () => {
  const f = make(13);
  F.startSession(f, seeded(6));
  const id = f.session.queue[0];
  F.setPresent(f, id, false);
  healthy(f);
  F.setPresent(f, id, true);
  eq(f.session.queue.at(-1), id);
  healthy(f);
});

test('Desfazer restaura estado completo, várias vezes', () => {
  const f = make(18);
  F.startSession(f, seeded(8));
  const s0 = JSON.stringify(f.session), p0 = JSON.stringify(f.players);
  F.registerWinner(f, 'A');
  const s1 = JSON.stringify(f.session);
  F.registerWinner(f, 'B');
  F.withdraw(f, f.session.queue[0]);
  F.undo(f);
  F.undo(f);
  eq(JSON.stringify(f.session), s1);
  F.undo(f);
  eq(JSON.stringify(f.session), s0); eq(JSON.stringify(f.players), p0);
  F.undo(f);
  eq(f.session, null);
});

test('Troca manual funciona entre campo e fila sem duplicar', () => {
  const f = make(15);
  F.startSession(f, seeded(11));
  const a = f.session.teams.A[0], q = f.session.queue[3];
  F.swapPlayers(f, a, q);
  eq(f.session.teams.A[0], q); eq(f.session.queue[3], a);
  healthy(f);
  F.undo(f);
  eq(f.session.teams.A[0], a);
});

test('Histórico registra quem venceu, quem saiu e quem entrou', () => {
  const f = make(18);
  F.startSession(f, seeded(12));
  const h = F.registerWinner(f, 'B');
  eq(h.no, 1); eq(h.winner, 'B'); eq(h.loser, 'A'); eq(h.out.length, 5); eq(h.entering.length, 5);
  eq(f.session.gameNo, 2); eq(f.session.rounds[0].no, 1); eq(f.session.rounds[0].names.A.length, 5);
});

test('Reiniciar mantém nomes; nova terça arquiva e limpa', () => {
  const f = make(12);
  F.startSession(f, seeded(13));
  F.registerWinner(f, 'A');
  F.newTuesday(f, true);
  eq(f.players, []); eq(f.session, null); eq(f.archive.length, 1); eq(f.archive[0].games.length, 1);
  const g = make(12);
  F.startSession(g, seeded(14));
  F.resetSession(g);
  eq(g.players.length, 12); eq(g.session, null);
});

test('Sobrevive a serialização (persistência)', () => {
  const f = make(18);
  F.startSession(f, seeded(15));
  F.registerWinner(f, 'A');
  const copy = JSON.parse(JSON.stringify(f));
  F.registerWinner(copy, 'B');
  healthy(copy);
  F.undo(copy);
  eq(JSON.stringify(copy.session), JSON.stringify(f.session));
});

// ------------------------------------------------------------------ FIFO, desistência, rodadas, financeiro
test('FIFO: depois dos 10 sorteados, a fila segue a ordem de chegada', () => {
  for (let i = 1; i <= 30; i++) {
    const f = make(23);
    F.startSession(f, seeded(i));
    eq(names(f, f.session.queue), Array.from({ length: 13 }, (_, k) => `J${String(k + 11).padStart(2, '0')}`));
  }
});

test('Desistência em campo: nome riscado, primeiro da fila entra na mesma vaga, resto da fila mantém a ordem', () => {
  const f = make(17);
  F.startSession(f, seeded(21));
  const out = f.session.teams.B[3], q = [...f.session.queue];
  const sub = F.withdraw(f, out);
  ok(f.players.find((p) => p.id === out).quit, 'marcado como desistente');
  ok(f.players.some((p) => p.id === out), 'não foi excluído');
  eq(f.session.teams.B[3], q[0], 'primeiro elegível ocupa a vaga');
  eq(f.session.queue, q.slice(1), 'demais permanecem na ordem');
  eq(sub.in, q[0]); eq(sub.out, out); eq(sub.team, 'B');
  healthy(f);
  // não volta em escalações futuras
  for (let g = 0; g < 40; g++) { F.registerWinner(f, g % 3 ? 'A' : 'B'); ok(!F.teamOf(f, out) && !f.session.queue.includes(out)); healthy(f); }
});

test('Desistência registra a substituição na rodada e não muda o resultado', () => {
  const f = make(13);
  F.startSession(f, seeded(22));
  const out = f.session.teams.A[0], enters = f.session.queue[0];
  F.withdraw(f, out);
  const r = F.registerWinner(f, 'A');
  eq(r.winner, 'A'); eq(r.subs.length, 1); eq(r.subs[0].outName, F.nameOf(f, out)); eq(r.subs[0].inName, F.nameOf(f, enters));
  ok(r.teams.A.includes(enters) && !r.teams.A.includes(out), 'fotografia da rodada mostra quem terminou o jogo');
});

test('Desistência na fila: sai da fila sem mexer nos times', () => {
  const f = make(16);
  F.startSession(f, seeded(23));
  const A = [...f.session.teams.A], B = [...f.session.teams.B], id = f.session.queue[2];
  eq(F.withdraw(f, id), null);
  eq(f.session.teams.A, A); eq(f.session.teams.B, B); ok(!f.session.queue.includes(id));
  healthy(f);
  throws(() => F.withdraw(f, id), /já está/);
});

test('Desistência preserva rodadas anteriores e pode ser desfeita ou revertida', () => {
  const f = make(15);
  F.startSession(f, seeded(24));
  F.registerWinner(f, 'A');
  const before = JSON.stringify(f.session.rounds);
  const id = f.session.teams.A[1];
  F.withdraw(f, id);
  eq(JSON.stringify(f.session.rounds), before, 'rodadas intactas');
  eq(F.stats(f).find((r) => r.id === id).games, 1, 'histórico do desistente mantido');
  F.rejoin(f, id);
  eq(f.session.queue.at(-1), id, 'volta no fim da fila');
  healthy(f);
  F.undo(f); F.undo(f);
  eq(F.teamOf(f, id), 'A', 'desfazer devolve o estado anterior');
  healthy(f);
});

test('Quem já jogou não pode ser excluído, só marcado como desistente', () => {
  const f = make(12);
  F.startSession(f, seeded(25));
  F.registerWinner(f, 'B');
  throws(() => F.removePlayer(f, f.session.teams.B[0]), /não quer mais jogar/);
});

test('Rodadas: ordem cronológica, novas abaixo das antigas, fotografia dos dois times', () => {
  const f = make(18);
  F.startSession(f, seeded(26));
  const snaps = [];
  for (let g = 0; g < 6; g++) {
    const A = [...f.session.teams.A], B = [...f.session.teams.B];
    F.registerWinner(f, g % 2 ? 'B' : 'A');
    snaps.push(JSON.stringify(f.session.rounds));
    eq(f.session.rounds.at(-1).teams, { A, B });
    eq(f.session.rounds.map((r) => r.no), Array.from({ length: g + 1 }, (_, k) => k + 1));
  }
  for (let i = 0; i < snaps.length - 1; i++) ok(snaps.at(-1).startsWith(snaps[i].slice(0, -1)), 'rodadas antigas não mudam');
});

test('Refazer sorteio e reiniciar sessão preservam rodadas', () => {
  const f = make(14);
  F.startSession(f, seeded(27));
  F.registerWinner(f, 'A'); F.registerWinner(f, 'A');
  F.startSession(f, seeded(28));
  eq(f.session.rounds.length, 2); eq(f.session.gameNo, 3);
  F.resetSession(f);
  eq(f.archive.length, 1); eq(f.archive[0].games.length, 2); eq(f.archive[0].players.length, 14);
});

test('Estatísticas: jogos, vitórias, derrotas, quem ainda não jogou e desistentes', () => {
  const f = make(16);
  F.startSession(f, seeded(29));
  const A = [...f.session.teams.A], B = [...f.session.teams.B], waiting = f.session.queue.at(-1);
  F.registerWinner(f, 'A');
  const st = Object.fromEntries(F.stats(f).map((r) => [r.id, r]));
  for (const id of A) { eq(st[id].games, 1); eq(st[id].wins, 1); }
  for (const id of B) { eq(st[id].losses, 1); eq(st[id].teams[0].team, 'B'); }
  eq(st[waiting].games, 0); eq(st[waiting].state, 'ainda não jogou');
  F.withdraw(f, A[0]);
  eq(F.stats(f).find((r) => r.id === A[0]).state, 'desistiu');
  eq(F.stats(f).find((r) => r.id === A[0]).subOut, 1);
});

test('Financeiro: R$ 180/h × 2 h por 23 pessoas, soma exata em centavos', () => {
  const f = make(23);
  F.setFinance(f, { pricePerHour: 180, hours: 2 });
  const s = F.financeSummary(f);
  eq(s.total, 36000); eq(s.count, 23);
  eq(s.rows.reduce((a, r) => a + r.due, 0), 36000, 'soma das cotas = total');
  ok(s.rows.every((r) => r.due === 1565 || r.due === 1566), 'cotas de R$ 15,65 ou 15,66');
  eq(s.pendingCount, 23); eq(s.received, 0);
  F.setPaid(f, f.players[0].id, true); F.setPaid(f, f.players[1].id, true);
  const t = F.financeSummary(f);
  eq(t.paidCount, 2); eq(t.received, t.rows[0].due + t.rows[1].due); eq(t.pending, 36000 - t.received);
  F.setPaid(f, f.players[1].id, false);
  eq(F.financeSummary(f).paidCount, 1, 'correção de marcação');
  ok(f.finance.log.length >= 4, 'histórico de alterações');
  throws(() => F.setSplit(f, f.players[0].id, false), /já pagou/);
  F.setSplit(f, f.players[5].id, false);
  eq(F.financeSummary(f).count, 22);
  throws(() => F.setPaid(f, f.players[5].id, true), /rateio/);
  throws(() => F.setFinance(f, { pricePerHour: -1, hours: 2 }), /preço/);
});

test('Financeiro sobrevive a serialização e nova terça arquiva os pagamentos', () => {
  const f = make(12);
  F.setFinance(f, { pricePerHour: 150, hours: 1.5 });
  F.setPaid(f, f.players[0].id, true);
  const copy = F.normalizeFootball(JSON.parse(JSON.stringify(f)));
  eq(F.financeSummary(copy), F.financeSummary(f));
  F.startSession(copy, seeded(30)); F.registerWinner(copy, 'A');
  F.newTuesday(copy);
  eq(copy.archive[0].finance.paidCount, 1); eq(copy.finance.pricePerHour, 150); eq(copy.finance.payers, {});
});

test('Documento antigo (histórico invertido) vira rodadas na ordem certa', () => {
  const old = { players: [], undo: [{ label: 'x', players: [], session: { teams: { A: [], B: [] }, queue: [], history: [{ no: 2 }, { no: 1 }] } }], archive: [], visible: false,
    session: { teams: { A: [], B: [] }, queue: [], gameNo: 3, history: [{ no: 2 }, { no: 1 }] } };
  const f = F.normalizeFootball(old);
  eq(f.session.rounds.map((r) => r.no), [1, 2]); eq(f.session.history, undefined); eq(f.undo[0].session.rounds.length, 2);
  eq(F.financeSummary(f).total, 0);
});

document.getElementById('sum').textContent = `${pass} passaram · ${failed} falharam`;
document.getElementById('sum').className = failed ? 'ko' : 'ok';
window.__results = { pass, failed, failures };
document.title = `${pass} ok / ${failed} falhas`;
</script></body></html>
