<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tutory Sports (banco simulado)</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/screens.css">
  <script type="importmap">{ "imports": { "three": "./js/vendor/three/three.module.min.js" } }</script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    // O app inteiro sobre um banco simulado na memória (nada vai para o Supabase nem para data/).
    // ?visitor=1 abre sem o administrador.
    const db = {
      rev: 0, doc: null,
      async load() { return { rev: this.rev, doc: this.doc && structuredClone(this.doc) }; },
      async currentRev() { return this.rev; }, listen() {},
      async login() { return 'tok'; }, async session() { return true; }, async logout() {},
      async playerCode() { return 'ABC123'; },
      async saveAvatar(tk, id, code, avatar) { for (const c of Object.values(this.doc.comps)) { const p = c.players.find((x) => x.id === id); if (p) p.avatar = avatar; } return ++this.rev; },
      async save(t, rev, doc) { this.doc = JSON.parse(JSON.stringify(doc)); return { httpStatus: 200, rev: ++this.rev }; },
    };
    globalThis.__tutoryTestCloud = db;
    window.__db = db;
    // contas, agenda, comentários e regulamentos também simulados (tests/sports-mock.js + tests/fase8-mock.js)
    const { createMockSportsDb } = await import('./tests/sports-mock.js');
    const sdb = createMockSportsDb();
    for (const [k, name, g] of [['bia', 'Bia Lima', 'f'], ['caio', 'Caio Reis', 'm'], ['ana', 'Ana Souza', 'f']]) {
      await sdb.signUp(k + '@x.com', 'segredo1'); await sdb.saveProfile({ name, gender: g });
      await sdb.adminSetStatus('tok', sdb.current.id, 'approved'); sdb.asUser();
    }
    const r1 = await sdb.adminRegulationSave('tok', { modality: 'pingpong', title: 'Ping Pong (tênis de mesa)', official: '• Game até 11, com 2 de diferença.\n• Saque troca a cada 2 pontos.', internal: '• Melhor de 3 por padrão.', sources: 'ITTF Handbook' });
    await sdb.adminRegulationPublish('tok', r1.id); sdb.asUser();
    window.__sdb = sdb;
    const { sports } = await import('./js/core/sports.js');
    await sports.init(sdb);
    await import('./js/main.js');
    const { store } = await import('./js/ui/lib.js');
    window.__store = store;
    const wait = () => new Promise((r) => { const i = setInterval(() => { if (store.doc) { clearInterval(i); r(); } }, 30); });
    await wait();
    if (new URLSearchParams(location.search).get('visitor') !== '1') await store.login('x');
  </script>
</body>
</html>
